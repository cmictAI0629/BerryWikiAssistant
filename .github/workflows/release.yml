# 构建扩展安装包；推送 v<version> 标签时发布 GitHub Release。
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build zip
        id: pkg
        run: |
          npm run zip
          version="$(node -p "require('./package.json').version")"
          name="BerryWikiAssistant-${version}.zip"
          cp .output/berrywiki-assistant-${version}-chrome.zip "$name"
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "${{ steps.pkg.outputs.tag }}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.pkg.outputs.tag }}"; exit 1; }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.name }}" "${{ steps.pkg.outputs.name }}.sha256" \
            --title "BerryWiki 知识助手 ${GITHUB_REF_NAME#v}" \
            --notes "安装：解压后打开 chrome://extensions，开启「开发者模式」，点「加载已解压的扩展程序」选择解压出来的文件夹。更新内容见 CHANGELOG.md。"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}
